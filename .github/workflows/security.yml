name: security-gates

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  rust-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked
      - name: Verify committed lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Cargo deny advisories/licenses
        run: cargo deny check advisories licenses bans sources
      - name: Format check
        run: cargo fmt --all --check
      - name: Compile gpuf-c and gpuf-s
        run: |
          cargo check --locked -p gpuf-c --lib
          cargo check --locked -p gpuf-c --bin gpuf-c
          cargo check --locked -p gpuf-s
      - name: Targeted security tests
        run: |
          cargo test --locked -p gpuf-c handle::handle_udp::p2p_security_tests
          cargo test --locked -p gpuf-c llm_engine::llama_server::tests
          cargo test --locked -p gpuf-c llm_engine::anthropic_server::tests
          cargo test --locked -p gpuf-c util::safe_command::tests
          cargo test --locked -p gpuf-c util::security_metrics::tests
          cargo test --locked -p gpuf-c util::model_downloader::tests
          cargo test --locked -p gpuf-c util::config::tests
          cargo test --locked -p gpuf-c handle::handle_tcp::control_stream_tests
          cargo test --locked -p gpuf-c util::cmd::tests
          cargo test --locked -p gpuf-s util::cmd::tests
      - name: Source security grep gate
        run: |
          ! rg -n --glob '!**/target/**' --glob '!**/DerivedData/**' \
            '8[.]140[.]251[.]142|hf_[[:alnum:]]{20,}|sshpass[[:space:]]+-p|BEGIN[[:space:]].*PRIVATE[[:space:]]KEY|OLLAMA_HOST=0\.0\.0\.0|serde_yaml|serde_yml|Get-FileHash -Algorithm MD5|md5sum|verify_md5' \
            gpuf-c/src gpuf-c/docs gpuf-c/examples gpuf-c/install.sh gpuf-c/install_client.sh gpuf-c/install_client.ps1 gpuf-c/generate_sdk.sh gpuf-c/generate_ios_sdk.sh common/src gpuf-s/src
          ! rg -n --glob '!**/target/**' --glob '!**/DerivedData/**' 'static mut' \
            gpuf-c/src common/src gpuf-s/src
      - name: Generate security release evidence
        run: scripts/security_release_evidence.sh security-release-evidence
      - name: Validate strict release evidence gate
        run: |
          if GPUF_REQUIRE_ARTIFACTS=1 scripts/security_release_evidence.sh /tmp/security-release-evidence-strict; then
            echo "strict release evidence gate unexpectedly passed without artifacts"
            exit 1
          fi
      - name: Generate mobile SDK release gate evidence
        run: scripts/mobile_sdk_release_gate.sh security-release-evidence/mobile-sdk
      - name: Validate strict mobile SDK release gate
        run: |
          if GPUF_REQUIRE_MOBILE_EVIDENCE=1 scripts/mobile_sdk_release_gate.sh /tmp/mobile-sdk-release-evidence-strict; then
            echo "strict mobile SDK release gate unexpectedly passed without evidence"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-release-evidence
          path: security-release-evidence/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret scan
        run: gitleaks detect --no-git --source . --redact --no-banner
