[package]
name = "gpuf-p2p-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
anyhow = { workspace = true }
axum = { version = "0.7", features = ["json"] }
bincode = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "native-tls-vendored", "stream"] }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, default-features = false, features = ["full"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
